; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]
platform = espressif32@6.8.1
board = lilygo-t-display-s3
framework = arduino
debug_tool = esp-builtin
upload_protocol = esptool
lib_deps =
	bodmer/TFT_eSPI
	knolleary/PubSubClient@^2.8
	tzapu/WiFiManager
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-D BOARD=ESP32S3
	-D TOOLCHAIN=C11
	; TFT_eSPI Setup206 (LilyGo T-Display-S3, ST7789 8-bit parallel) als build_flags
	; statt User_Setup_Select.h, damit die Display-Config im Repo bleibt
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER
	-DINIT_SEQUENCE_3
	-DCGRAM_OFFSET
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DTFT_PARALLEL_8_BIT
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_WR=8
	-DTFT_RD=9
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_BL=38
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DSMOOTH_FONT
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub

[env:ttgo-t1]
platform = espressif32@6.8.1
board = ttgo-t1
framework = arduino
lib_deps = 
	bodmer/TFT_eSPI@^2.4.79
	knolleary/PubSubClient@^2.8
#	tzapu/WiFiManager
build_flags =
	-D BOARD=ESP32
	; TFT_eSPI Setup25 (TTGO T-Display, ST7789 240x135 SPI) als build_flags
	; statt User_Setup_Select.h, damit die Display-Config im Repo bleibt
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER
	-DTFT_SDA_READ
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DCGRAM_OFFSET
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DSMOOTH_FONT
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=6000000
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
