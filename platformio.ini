; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]
platform = espressif32@6.8.1
board = lilygo-t-display-s3
framework = arduino
debug_tool = esp-builtin
upload_protocol = esptool
lib_deps =
	bodmer/TFT_eSPI
	knolleary/PubSubClient@^2.8
	tzapu/WiFiManager
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-D BOARD=ESP32S3
	-D TOOLCHAIN=C11
	; TFT_eSPI Setup206 (LilyGo T-Display-S3, ST7789 8-bit parallel) als build_flags
	; statt User_Setup_Select.h, damit die Display-Config im Repo bleibt
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER
	-DINIT_SEQUENCE_3
	-DCGRAM_OFFSET
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DTFT_PARALLEL_8_BIT
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_WR=8
	-DTFT_RD=9
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_BL=38
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DSMOOTH_FONT
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub

[env:ttgo-t1]
platform = espressif32@6.8.1
board = ttgo-t1
framework = arduino
lib_deps = 
	bodmer/TFT_eSPI@^2.4.79
	knolleary/PubSubClient@^2.8
#	tzapu/WiFiManager
build_flags =
	-D BOARD=ESP32
	; TFT_eSPI Setup25 (TTGO T-Display, ST7789 240x135 SPI) als build_flags
	; statt User_Setup_Select.h, damit die Display-Config im Repo bleibt
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER
	-DTFT_SDA_READ
	-DTFT_WIDTH=135
	-DTFT_HEIGHT=240
	-DCGRAM_OFFSET
	-DTFT_MOSI=19
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=16
	-DTFT_RST=23
	-DTFT_BL=4
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF
	-DSMOOTH_FONT
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=6000000
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

[env:esp32-s3-epaper154]
;
; Waveshare ESP32-S3-ePaper-1.54 (V1 und V2) - Integrationsboard mit fest
; verbautem 1.54"-Panel (200x200 s/w, SSD1681). Pinbelegung uebernommen aus
; dem Hersteller-Beispiel:
;   waveshareteam/ESP32-S3-ePaper-1.54 -> 02_Example/.../epaper_config.h
; (V1 und V2 sind dort fuer das Display identisch belegt).
;
; Gezeichnet wird ueber src/epd_display.h, einen TFT_eSPI-kompatiblen Wrapper
; um GxEPD2 - der Layout-Code in main.cpp bleibt fuer alle Boards derselbe.
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
lib_deps =
	zinggjm/GxEPD2@^1.6.0
	adafruit/Adafruit GFX Library@^1.11.9
	knolleary/PubSubClient@^2.8
	tzapu/WiFiManager
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-D BOARD=ESP32S3
	-D TOOLCHAIN=C11
	-D EPAPER
	; --- Display (fest verdrahtet auf dem Board) ------------------------------
	-D EPD_DC=10
	-D EPD_CS=11
	-D EPD_SCK=12
	-D EPD_MOSI=13
	-D EPD_RST=9
	-D EPD_BUSY=8
	; Spannungsfreigabe des Panels, aktiv LOW. Ohne sie bleibt das Bild leer.
	-D EPD_PWR_PIN=6
	-D EPD_PWR_ON_LEVEL=0
	; Weitere Versorgungspfade auf dem Board, hier nicht benoetigt:
	;   GPIO 17 = VBAT-Freigabe (aktiv HIGH, fuer Akkubetrieb)
	;   GPIO 42 = Audio-Freigabe (aktiv LOW)
	-D EPD_SPI_HZ=4000000
	; Diagnose von GxEPD2 auf Serial: gibt Refresh-Dauern in Mikrosekunden und
	; "Busy Timeout!" aus. Plausibel sind ~1.380.000 us voll / ~362.000 us
	; partiell - Werte im einstelligen Bereich heissen: Panel nicht erreichbar.
	-D EPD_DIAG_BAUD=0
	; Bei neuerer Panel-Revision (GDEY0154D67) zusaetzlich setzen:
	;-D EPD_PANEL_GDEY0154D67
	; Panel ist quadratisch: 0..3 dreht das Bild (Lage des Flachbandkabels)
	-D EPD_ROTATION=0
	; nach wie vielen Teil-Refreshes einmal voll aufgefrischt wird
	-D EPD_FULL_REFRESH_EVERY=12
	; --- Taster (beide aktiv LOW mit internem Pullup) ---
	; Das Board hat genau zwei: PWR und BOOT.
	-D BUTTON1PIN=18
	-D BUTTON2PIN=0
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
